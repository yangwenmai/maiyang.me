intro: |
  过去一年多，我把大部分业余时间都投入到了 AI，持续在构建产品。
  白天做研发管理，晚上和周末和 Agent 一起写代码、上架、踩坑。
  成果、思考、弯路和失败，我都会在 X 上记录下来。

