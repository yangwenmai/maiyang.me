  - { type: out, text: "Cursor 中国区首位 Ambassador" }
  - { type: out, text: "SpaceXAI Ambassador" }
  - { type: out, text: "Go 夜读发起人 · since 2018-03-21" }
  - { type: cmd, text: "agent run --goal \"idea → App Store\"" }
  - { type: ok,  text: "plan    和 ChatGPT 聊定位" }
  - { type: ok,  text: "build   Cursor 写完第一行到上架" }
  - { type: ok,  text: "ship    教育类付费榜 #23" }
